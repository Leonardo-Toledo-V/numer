<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="760" viewBox="0 0 1100 760" role="img" aria-labelledby="title desc"><title id="title">W01 · Acceso e inicio guiado</title><desc id="desc">Wireframe de Numer. Datos sintéticos. Propuesta de experiencia sin persistencia.</desc>
<style>text{font-family:Manrope,Arial,sans-serif}</style>
<rect x="0" y="0" width="1100" height="760" rx="0" fill="#F5F6F7"/>
<rect x="32" y="32" width="360" height="676" rx="24" fill="#164E4A"/>
<image href="data:image/svg+xml;base64," x="66" y="70" width="160" height="52"/>
<text x="66" y="220.0" font-size="28" font-weight="500" fill="#F5F6F7">Tus cuentas</text>
<text x="66" y="262.0" font-size="28" font-weight="500" fill="#F5F6F7">y tarjetas, en</text>
<text x="66" y="304.0" font-size="28" font-weight="500" fill="#F5F6F7">un mismo lugar.</text>
<text x="66" y="372.0" font-size="18" font-weight="400" fill="#C4DCD8">Organiza tu dinero, tu crédito y</text>
<text x="66" y="399.0" font-size="18" font-weight="400" fill="#C4DCD8">tus pagos con claridad.</text>
<rect x="456" y="96" width="568" height="538" rx="20" fill="#FFFFFF" stroke="#DCE2E1"/>
<text x="492" y="156.0" font-size="28" font-weight="500" fill="#222629">Empieza con lo esencial</text>
<text x="492" y="202.0" font-size="16" font-weight="400" fill="#222629">Accede a tu espacio con tu cuenta de Google.</text>
<rect x="492" y="234" width="440" height="44" rx="8" fill="#185B56"/>
<text x="506" y="262.0" font-size="14" font-weight="500" fill="#FFFFFF">Continuar con Google</text>
<path d="M492 316h440" stroke="#DCE2E1"/>
<text x="492" y="354.0" font-size="16" font-weight="500" fill="#222629">Después, añade tu primera cuenta o tarjeta.</text>
<text x="492" y="399.0" font-size="14" font-weight="400" fill="#566265">Puedes completar el resto de tus registros después.</text>
<text x="492" y="458.0" font-size="14" font-weight="400" fill="#222629">Para identificar tarjetas usaremos banco y alias.</text>
<text x="492" y="498.0" font-size="14" font-weight="400" fill="#566265">No te pediremos número, titular, CVV ni vencimiento.</text>
<text x="24" y="740.0" font-size="11" font-weight="400" fill="#566265">W01 · Propuesta · Acceso y explicación del primer paso; el alta se abre después de autenticar.</text>
